<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitworld ($BTW)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1419;--bg2:#161b22;
  --card:rgba(255,255,255,0.08);--border:rgba(255,255,255,0.14);
  --text:#f0f4f8;--muted:#a0aec0;--blue:#38bdf8;--green:#4ade80;--danger:#f87171;
  --grad:linear-gradient(135deg,#38bdf8,#4ade80);
  --font:'Inter',system-ui,sans-serif;--disp:'Orbitron',sans-serif;
}
html{scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);line-height:1.5;min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
button:disabled{opacity:.5;cursor:not-allowed}
input{font-family:inherit}

.av,.pa{border-radius:50%;background:var(--grad);overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:700;color:#0f1419}
.av img,.pa img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}

.topbar{position:fixed;top:0;left:0;right:0;z-index:100;height:56px;background:rgba(15,20,25,0.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:1.05rem}
.logo-i{width:28px;height:28px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:0.65rem;color:#0f1419;font-weight:800}
.ham{width:36px;height:36px;border-radius:10px;background:var(--card);border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.ham span{display:block;width:16px;height:2px;background:var(--text);border-radius:2px;transition:0.25s}
.ham.on span:nth-child(1){transform:translateY(6px) rotate(45deg)}
.ham.on span:nth-child(2){opacity:0}
.ham.on span:nth-child(3){transform:translateY(-6px) rotate(-45deg)}

.ov{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:90;opacity:0;pointer-events:none;transition:0.3s}
.ov.on{opacity:1;pointer-events:auto}
.side{position:fixed;top:56px;right:0;bottom:0;width:270px;background:var(--bg2);border-left:1px solid var(--border);z-index:95;transform:translateX(100%);transition:transform 0.3s;overflow-y:auto;padding:16px 0}
.side.on{transform:translateX(0)}
.side-user{padding:0 16px 16px;border-bottom:1px solid var(--border);margin-bottom:8px}
.side-user .av{width:44px;height:44px;margin-bottom:8px;font-size:1rem}
.side-user .nm{font-weight:600;font-size:0.92rem}
.side-user .ad{font-size:0.72rem;color:var(--muted)}
.sl{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:0.9rem;color:var(--muted);width:100%;text-align:left}
.sl:hover{color:var(--text);background:rgba(56,189,248,0.08)}
.sl .ic{width:22px;text-align:center}
.sd{height:1px;background:var(--border);margin:8px 16px}

.bot{position:fixed;bottom:0;left:0;right:0;z-index:100;height:58px;background:rgba(15,20,25,0.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around}
.bi{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;color:var(--muted);font-size:0.65rem;font-weight:500}
.bi .ic{font-size:1.2rem}
.bi.on{color:var(--blue)}

.pg{display:none;padding:68px 16px 80px;max-width:480px;margin:0 auto;min-height:100vh}
.pg.on{display:block}
.pt{font-size:1.3rem;font-weight:700;margin-bottom:4px}
.ps{font-size:0.84rem;color:var(--muted);margin-bottom:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:12px}
.ct{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.empty{text-align:center;padding:14px;color:var(--muted);font-size:0.85rem}

.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:12px 18px;border-radius:10px;font-weight:600;font-size:0.9rem;width:100%}
.bp{background:var(--grad);color:#0f1419;box-shadow:0 2px 12px rgba(56,189,248,0.3)}
.bo{background:transparent;border:1px solid var(--border);color:var(--text)}
.bd{color:var(--danger)}
.bs{padding:8px 14px;font-size:0.8rem;width:auto}
.br{display:flex;gap:10px;margin-top:12px}
.br .btn{flex:1}

.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sb{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.sb .v{font-family:var(--disp);font-size:1.1rem;font-weight:700;color:var(--blue)}
.sb .l{font-size:0.7rem;color:var(--muted);margin-top:2px}

.coin{width:100px;height:100px;border-radius:50%;background:linear-gradient(145deg,#0369a1,#38bdf8 50%,#4ade80);box-shadow:0 0 30px rgba(56,189,248,0.3);display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 16px;animation:fl 4s ease-in-out infinite}
.coin span:first-child{font-family:var(--disp);font-size:1.4rem;font-weight:700;color:#fff}
.coin span:last-child{font-size:0.5rem;letter-spacing:1.5px;color:rgba(255,255,255,0.8)}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.ht{text-align:center;font-size:1.5rem;font-weight:800;margin-bottom:6px}
.ht span{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.hd{text-align:center;color:var(--muted);font-size:0.88rem;margin-bottom:16px}
.ca{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-top:14px}
.ca .t{flex:1;font-family:monospace;font-size:0.68rem;color:var(--blue);word-break:break-all}

.ms{text-align:center;padding:20px 16px;background:var(--card);border:1px solid var(--border);border-radius:16px;margin-bottom:14px}
.mr{font-family:var(--disp);font-size:2rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.mrl{font-size:0.8rem;color:var(--muted);margin-top:4px}
.mgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.mii{background:rgba(255,255,255,0.06);border-radius:10px;padding:10px 6px;text-align:center}
.mii .v{font-weight:700;font-size:0.95rem;color:var(--blue)}
.mii .l{font-size:0.65rem;color:var(--muted);margin-top:2px}
.pw{margin:12px 0 4px}
.pl{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--muted);margin-bottom:6px}
.pb{height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;background:var(--grad);width:0%;transition:width 0.4s}
.info{font-size:0.88rem;color:var(--muted);line-height:1.7}
.info b{color:var(--blue)}
.mbtn{width:100%;padding:15px;border-radius:12px;background:var(--grad);color:#0f1419;font-weight:700;font-size:1rem;margin-top:14px;box-shadow:0 4px 18px rgba(56,189,248,0.3)}
.mbtn.run{background:rgba(56,189,248,0.15);color:var(--blue);border:1px solid var(--blue);box-shadow:none}
.note{text-align:center;font-size:0.75rem;color:var(--muted);margin-top:10px}

.bal{text-align:center;padding:24px 16px;background:linear-gradient(135deg,rgba(56,189,248,0.12),rgba(74,222,128,0.1));border:1px solid rgba(56,189,248,0.25);border-radius:16px;margin-bottom:14px}
.bal .lb{font-size:0.8rem;color:var(--muted)}
.bal .vl{font-family:var(--disp);font-size:2rem;font-weight:700;margin:6px 0}
.wa{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:14px}
.wai{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--card);border:1px solid var(--border);border-radius:12px;font-size:0.75rem;color:var(--muted)}
.wi{width:36px;height:36px;border-radius:50%;background:rgba(56,189,248,0.15);display:flex;align-items:center;justify-content:center;font-size:1.1rem}

.ph{text-align:center;margin-bottom:18px}
.pa{width:70px;height:70px;font-size:1.5rem;margin:0 auto 10px}
.pa.big{width:140px;height:140px;font-size:3.5rem}
.pn{font-size:1.1rem;font-weight:700}
.pi{font-size:0.8rem;color:var(--muted)}
.pst{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.pst .p{text-align:center;padding:12px 6px;background:var(--card);border:1px solid var(--border);border-radius:10px}
