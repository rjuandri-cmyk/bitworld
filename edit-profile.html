
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profil - Bitworld</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #07110c;
      color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 480px;
      margin: 30px auto;
      padding: 24px;
      background: #102219;
      border: 1px solid #24563b;
      border-radius: 18px;
    }

    h2 {
      color: #40e879;
      text-align: center;
    }

    .logo {
      text-align: center;
      font-size: 27px;
      font-weight: bold;
      color: #40e879;
      margin-bottom: 25px;
    }

    .avatar {
      width: 100px;
      height: 100px;
      margin: 20px auto;
      border-radius: 50%;
      background: #203b2b;
      border: 3px solid #40e879;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 40px;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      color: #d8f5e2;
    }

    input {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid #356348;
      background: #07170e;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 18px;
      border: none;
      border-radius: 9px;
      background: #40e879;
      color: #06210f;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 22px;
      color: #40e879;
      text-decoration: none;
    }

    .note {
      color: #b5c9bb;
      font-size: 13px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">🌐 Bitworld</div>
    <h2>Edit Profil</h2>

    <div class="avatar" id="avatar">👤</div>

    <label for="photo">Foto Profil</label>
    <input type="file" id="photo" accept="image/*">

    <label for="name">Nama Pengguna</label>
    <input
      type="text"
      id="name"
      maxlength="40"
      placeholder="Masukkan nama pengguna"
    >

    <button type="button" onclick="saveProfile()">
      Simpan Profil
    </button>

    <p class="note">
      Profil pada halaman ini disimpan di penyimpanan browser
      perangkat ini. Perubahan belum otomatis tersinkron
      ke perangkat lain atau server.
    </p>

    <a class="back" href="index.html">← Kembali ke Bitworld</a>
  </div>

  <script>
    const nameInput = document.getElementById("name");
    const photoInput = document.getElementById("photo");
    const avatar = document.getElementById("avatar");

    let photoData = "";

    try {
      nameInput.value =
        localStorage.getItem("bitworld_username") || "";

      photoData =
        localStorage.getItem("bitworld_photo") || "";

      if (photoData) {
        avatar.innerHTML = "";
        const img = document.createElement("img");
        img.src = photoData;
        img.alt = "Foto profil";
        avatar.appendChild(img);
      }
    } catch (error) {
      console.log("Penyimpanan profil tidak tersedia.");
    }

    photoInput.addEventListener("change", function () {
      const file = this.files[0];
      if (!file) return;

      if (!file.type.startsWith("image/")) {
        alert("Pilih file gambar yang valid.");
        return;
      }

      if (file.size > 2 * 1024 * 1024) {
        alert("Ukuran foto maksimal 2 MB.");
        this.value = "";
        return;
      }

      const reader = new FileReader();

      reader.onload = function (event) {
        photoData = event.target.result;
        avatar.innerHTML = "";

        const img = document.createElement("img");
        img.src = photoData;
        img.alt = "Pratinjau foto profil";
        avatar.appendChild(img);
      };

      reader.readAsDataURL(file);
    });

    function saveProfile() {
      const username = nameInput.value.trim();

      if (!username) {
        alert("Silakan masukkan nama pengguna.");
        return;
      }

      try {
        localStorage.setItem("bitworld_username", username);

        if (photoData) {
          localStorage.setItem("bitworld_photo", photoData);
        }

        alert("Profil tersimpan di browser perangkat ini.");
      } catch (error) {
        alert(
          "Penyimpanan gagal. Coba gunakan foto yang lebih kecil."
        );
      }
    }
  </script>
</body>
</html>
